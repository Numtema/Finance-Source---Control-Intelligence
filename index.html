<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Finance Source | Control Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
      /* Custom scrollbar for data tables */
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: #1e293b; }
      ::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: #64748b; }

      /* PRINT STYLES FOR PDF EXPORT */
      @media print {
        @page { margin: 0.5cm; size: A4 portrait; }
        body { 
          background-color: #ffffff !important; 
          color: #000000 !important; 
          -webkit-print-color-adjust: exact !important; 
          print-color-adjust: exact !important;
        }
        /* Hide Navigation and Buttons */
        nav, button, input, .no-print { display: none !important; }
        
        /* Adjust Layout for Print */
        #root { padding-bottom: 0 !important; }
        main { margin-top: 0 !important; padding: 0 !important; max-width: 100% !important; }
        
        /* Force dark backgrounds to print as dark blocks for aesthetics, or inverse for ink saving.
           Here we keep the "Dark Mode" look because it's the brand identity. */
        .bg-slate-950, .bg-slate-900, .bg-slate-800 {
          background-color: #1e293b !important; /* Slightly lighter for print contrast */
          color: #f8fafc !important;
          border: 1px solid #cbd5e1 !important;
          break-inside: avoid;
        }
        .text-slate-200, .text-slate-300, .text-slate-400 {
          color: #e2e8f0 !important;
        }
        
        /* Ensure charts and text don't get cut off */
        .break-inside-avoid { break-inside: avoid; }
      }
    </style>
